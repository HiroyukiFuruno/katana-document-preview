name: Release Publish Retry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to publish, for example v0.5.5"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          path: release-tools

      - name: Check out exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Verify immutable release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          test "$(git -C release-source rev-parse HEAD)" = "$(git -C release-source rev-list -n 1 "${RELEASE_TAG}")"
          cd release-source
          bash ../release-tools/scripts/release/verify-version.sh "${RELEASE_TAG}"

      - name: Publish crates.io from release tag
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd release-source
          bash ../release-tools/scripts/release/publish-crates.sh "${{ inputs.version }}"
