[package]
name = "katana-document-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "KatanA document viewer runtime, presentation, and export foundation."

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "kdv-spreadsheet-worker"
path = "src/kdv_spreadsheet_worker.rs"

[dependencies]
katana-ui-core = "=0.3.7"
cosmic-text = { workspace = true }
epaint_default_fonts = { workspace = true }
flate2 = { workspace = true }
hayro = { workspace = true }
image = { workspace = true }
ironcalc = { workspace = true }
katana-markdown-model = { workspace = true }
katana-render-runtime = { workspace = true }
office2pdf = { workspace = true }
process_control = { workspace = true }
quick-xml = { workspace = true }
resvg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syntect = { workspace = true }
thiserror = { workspace = true }
tiny-skia = { workspace = true }
tracing = { workspace = true }
skarn-sandbox = { workspace = true }
tempfile = { workspace = true }
v8 = { workspace = true }
xmltree = { workspace = true }
zip = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
seccompiler = { workspace = true }

[target.'cfg(unix)'.dependencies]
rlimit = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { workspace = true }

[target.'cfg(windows)'.dependencies]
rappct = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
