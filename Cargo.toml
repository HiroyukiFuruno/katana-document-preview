[workspace]
members = [
    "crates/kdv-linter",
    "crates/katana-document-viewer",
    "tools/kdv-storybook",
]
resolver = "2"

[workspace.package]
version = "0.5.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/HiroyukiFuruno/katana-document-viewer"
rust-version = "1.95.0"
authors = ["Hiroyuki Furuno"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
emojis = "0.9"
epaint_default_fonts = "0.36"
thiserror = "2"
tracing = "0.1"
quick-xml = "0.42"
rappct = "=0.13.3"
rlimit = "0.11"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
katana-markdown-model = "0.2.1"
katana-render-runtime = "0.4.19"
katana-ui-core = { version = "=0.3.7", features = ["raster-host"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
cosmic-text = "0.19"
flate2 = "1"
hayro = "=0.7.1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ironcalc = "=0.8.3"
libc = "=0.2.189"
minifb = "0.28"
office2pdf = { package = "office2pdf-katana", version = "=0.6.10" }
process_control = "5.2"
resvg = "0.48"
skarn-sandbox = "=1.0.1"
seccompiler = "=0.5.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tempfile = "3"
tiny-skia = "0.12"
ignore = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
katana-ast-lint = "0.5.1"
syn = { version = "3", features = ["full", "visit"] }
toml = "1.1"
v8 = { version = "=152.2.0", features = ["simdutf"] }
xmltree = "0.12"

[profile.test]
opt-level = 2
